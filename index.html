        // Helper to replace hyphens between words/Hebrew text with standard Hebrew Maqaf (־)
        function convertHyphensToHebrewMaqaf(text) {
            if (typeof text !== 'string') return text;
            // Replaces hyphen '-' between Hebrew letters, or Hebrew letters and numbers/words with '־'
            // Preserves ranges like years "1865 - 1918" and HTML/ASCII structure
            return text.replace(/([\u0590-\u05FF])-([\u0590-\u05FF])/g, '$1־$2')
                       .replace(/([\u0590-\u05FF])-(\d)/g, '$1־$2')
                       .replace(/(\d)-([\u0590-\u05FF])/g, '$1־$2');
        }

        // Recursively convert hyphens in object fields
        function processFamilyData(node) {
            const newNode = { ...node };
            if (newNode.name) newNode.name = convertHyphensToHebrewMaqaf(newNode.name);
            if (newNode.dates) newNode.dates = convertHyphensToHebrewMaqaf(newNode.dates);
            if (newNode.location) newNode.location = convertHyphensToHebrewMaqaf(newNode.location);
            if (newNode.bio) newNode.bio = convertHyphensToHebrewMaqaf(newNode.bio);

            if (newNode.children) {
                newNode.children = newNode.children.map(processFamilyData);
            }
            return newNode;
        }

        const familyData = processFamilyData(rawFamilyData);

        function countNodes(node) {

            if (node.children) {

            }
            return count;
        }

        // Helper to generate Google Maps Search URL dynamically for any location
        function getGoogleMapsUrl(locationStr) {
            if (!locationStr) return '';
            
            // If there's a migration path with arrows (← or ->), take only the final destination
            let targetLocation = locationStr;
            if (locationStr.includes('←')) {
                const parts = locationStr.split('←');
                targetLocation = parts[parts.length - 1];
            } else if (locationStr.includes('->')) {
                const parts = locationStr.split('->');
                targetLocation = parts[parts.length - 1];
            }

            // Clean up extra formatted text (e.g. parenthetical notes) for cleaner search query
            const cleanLocation = targetLocation.replace(/\(.*?\)/g, '').trim();
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanLocation)}`;
        }

            const container = document.getElementById(`children-${id}`);

                    if (icon) icon.innerText = '◀';

            const containers = document.querySelectorAll('.children-container');
            containers.forEach(c => {

                if (card) card.classList.remove('search-match');
            });

            if (!cleanQuery) {
                nodes.forEach(wrapper => wrapper.style.display = 'block');
                document.getElementById('searchResultsSummary').classList.add('hidden');
                return;
            }

            // Create a word boundary regex to match exact words only
            const escapedQuery = cleanQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const exactWordRegex = new RegExp(`(?:^|\\s|["'״׳,.\\-־\\(])${escapedQuery}(?=$|\\s|["'״׳,.\\-־\\)])`, 'i');

            nodes.forEach(wrapper => {
                const nodeId = wrapper.getAttribute('data-id');
                const node = findNode(familyData, nodeId);
                if (!node) return;

                const nameClean = (node.name || '').toLowerCase().replace(/[-־]/g, ' ');
                const locClean = (node.location || '').toLowerCase().replace(/[-־]/g, ' ');
                const bioClean = (node.bio || '').toLowerCase().replace(/[-־]/g, ' ');

                const textMatch = exactWordRegex.test(nameClean) || exactWordRegex.test(locClean) || exactWordRegex.test(bioClean);

                if (textMatch) {
                    wrapper.style.display = 'block';
                    matchCount++;
                    // Highlight matching card
                    const card = wrapper.querySelector('.card');
                    if (card) card.classList.add('search-match');

                    // Expand and show all parent containers
                    let p = wrapper.parentElement;
                    while (p && !p.classList.contains('max-w-7xl')) {
                        if (p.classList.contains('children-container')) {
                            p.classList.remove('hidden');
                            const pId = p.id.replace('children-', '');
                            const icon = document.getElementById(`icon-${pId}`);
                            if (icon) icon.innerText = '▼';
                        }
                        if (p.classList.contains('tree-node-wrapper')) {
                            p.style.display = 'block';
                        }
                        p = p.parentElement;
                    }
                } else {
                    wrapper.style.display = 'none';
                }
            });

            const summary = document.getElementById('searchResultsSummary');
            summary.classList.remove('hidden');
            summary.innerText = `נמצאו ${matchCount} תוצאות מדויקות עבור המילה "${cleanQuery}" - התוצאות וענפי האב מורחבים ומובלטים במסגרת מוזהבת`;
        }

        // Modal Handler
        function openDetails(id) {
            const node = findNode(familyData, id);
            if (!node) return;

            const mapsUrl = getGoogleMapsUrl(node.location);

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <span class="inline-block px-3 py-1 text-xs font-bold rounded-full badge-gen-${node.gen} mb-2">דור ${node.gen}</span>
                        <h2 class="text-2xl font-bold text-slate-900">${node.name}</h2>
                        ${node.dates ? `<p class="text-sm font-semibold text-slate-600 mt-1">🗓️ שנות חיים/תאריכים: ${node.dates}</p>` : ''}
                    </div>

                    ${node.location ? `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between gap-2">
                            <div>
                                <span class="text-xs font-bold text-slate-400 block mb-1">מקום מגורים/הגירה:</span>
                                <span class="text-sm text-slate-800 font-medium">📍 ${node.location}</span>
                            </div>
                            <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="flex-shrink-0 flex items-center gap-1 text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg transition shadow-sm">
                                🗺️ ניווט במפות
                            </a>
                        </div>
                    ` : ''}

                    ${node.bio ? `
                        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100">
                            <span class="text-xs font-bold text-blue-600 block mb-1">מידע היסטורי וביוגרפי:</span>
                            <p class="text-sm text-slate-700 leading-relaxed">${node.bio}</p>
                        </div>
                    ` : ''}

                    ${node.children ? `
                        <div class="border-t pt-3">
                            <span class="text-xs font-bold text-slate-400 block mb-2">צאצאים ישירים (${node.children.length}):</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${node.children.map(c => `<span class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md font-medium border cursor-pointer" onclick="openDetails('${c.id}')">${c.name}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            const treeContainer = document.getElementById('treeContainer');
            treeContainer.innerHTML = createTreeNodeHTML(familyData);

            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            // Controls
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                activeFilters.search = val;
                
                if (val.trim().length > 0) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                
                filterTree();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                activeFilters.search = '';
                clearSearchBtn.classList.add('hidden');
                searchInput.focus();
                filterTree();
            });

            document.getElementById('expandAllBtn').addEventListener('click', () => setAllExpanded(true));
            document.getElementById('collapseAllBtn').addEventListener('click', () => setAllExpanded(false));

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('detailModal').classList.add('hidden');
            });

            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    document.getElementById('detailModal').classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
