            function traverse(currNode) {
                if (!currNode || countedIds.has(currNode.id)) return;
                countedIds.add(currNode.id);

                if (currNode.gen >= 1 && currNode.gen <= 5) {
                    genCounts[currNode.gen]++;
                    totalDescendants++;

                    currNode.children.forEach(child => {

            let html = `
                <div class="flex items-start justify-between gap-3">
                    <div class="flex items-center gap-2 shrink-0">
                        <button onclick="openModal('${node.id}'); event.stopPropagation();" class="${infoButtonClass}" title="מידע נוסף">
                            ${infoButtonContent}
                        </button>
                        <button onclick="openEditModal('${node.id}'); event.stopPropagation();" class="w-9 h-9 bg-slate-100 hover:bg-amber-100 text-slate-600 hover:text-amber-700 border border-slate-200 hover:border-amber-300 rounded-xl transition flex items-center justify-center shadow-sm" title="הצעת עדכון או תיקון פרטים">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="flex-1 cursor-pointer flex flex-col gap-1" onclick="openModal('${node.id}')">
                        <div class="flex items-center gap-2">
                            ${node.gen > 0 ? `
                                <span class="text-xs font-bold px-2 py-0.5 rounded-md badge-gen-${node.gen} shrink-0">
                                    דור ${node.gen}
                                </span>
                            ` : ''}
                            <h3 class="${titleSizeClass} leading-snug hover:text-blue-600 transition">
                                ${node.name}
                            </h3>
                        </div>

                        ${node.location ? `
                            <div class="text-xs text-slate-600 font-medium flex items-center gap-1 mt-0.5 pr-1">
                                <span>📍</span> <span>${node.location}</span>
                            </div>
                        ` : ''}
                    </div>

                    ${hasChildren ? `
                        <div class="shrink-0 flex items-center self-center">
                            <button onclick="toggleNode('${node.id}', event)" class="w-9 h-9 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-800 hover:text-slate-950 transition flex items-center justify-center border-2 border-slate-300 shadow-sm" title="${isExpanded ? 'כווץ ענף' : 'הרחב ענף'}">
                                <svg class="w-4 h-4 transform transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;

            card.innerHTML = html;

            if (hasChildren) {
                const childrenContainer = document.createElement("div");
                childrenContainer.className = `pr-4 sm:pr-6 mt-3 space-y-2 tree-line ${isExpanded ? '' : 'hidden'}`;
                childrenContainer.id = `children-${node.id}`;
                
                node.children.forEach(child => {
                    childrenContainer.appendChild(renderNode(child));
                });
                
                card.appendChild(childrenContainer);
            }

            return card;
        }

        function findNodeById(node, id) {
            if (node.id === id) return node;
            if (node.children) {
                for (let child of node.children) {
                    const res = findNodeById(child, id);
                    if (res) return res;
                }
            }
            return null;
        }

        function toggleNode(nodeId, event) {
            if (event) event.stopPropagation();
            expandedState[nodeId] = !expandedState[nodeId];
            
            const childrenContainer = document.getElementById(`children-${nodeId}`);
            if (childrenContainer) {
                if (expandedState[nodeId]) {
                    childrenContainer.classList.remove('hidden');
                } else {
                    childrenContainer.classList.add('hidden');
                }
            }
            
            const card = document.getElementById(`node-${nodeId}`);
            if (card) {
                const btnSvg = card.querySelector('button svg');
                if (btnSvg) {
                    if (expandedState[nodeId]) {
                        btnSvg.classList.add('rotate-180');
                    } else {
                        btnSvg.classList.remove('rotate-180');
                    }
                }
            }
        }

        let currentEditingNodeId = null;

        function openEditModal(nodeId) {
            const node = findNodeById(rawFamilyData, nodeId);
            if (!node) return;
            currentEditingNodeId = node.id;

            document.getElementById("editModalPersonName").textContent = `עבור: ${node.name}`;
            document.getElementById("reporterName").value = "";
            document.getElementById("updateDetails").value = "";
            document.getElementById("editModal").classList.remove("hidden");
        }

        function setupUpdateSubmission() {
            const adminPhone = "972545244344";
            const adminEmail = "pinilev@gmail.com";

            function getUpdateData() {
                const node = findNodeById(rawFamilyData, currentEditingNodeId);
                const reporter = document.getElementById("reporterName").value.trim() || "בן משפחה";
                const type = document.getElementById("updateType").value;
                const details = document.getElementById("updateDetails").value.trim();

                if (!details) {
                    showNotification("נא להזין פירוט לפני השליחה.");
                    return null;
                }

                return { node, reporter, type, details };
            }

            function showNotification(text) {
                const existing = document.getElementById("customNotification");
                if (existing) existing.remove();

                const note = document.createElement("div");
                note.id = "customNotification";
                note.className = "fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg z-50 text-sm animate-in fade-in";
                note.textContent = text;
                document.body.appendChild(note);
                setTimeout(() => note.remove(), 3000);
            }

            document.getElementById("sendWhatsappBtn").addEventListener("click", () => {
                const data = getUpdateData();
                if (!data) return;

                const msg = `*הצעת עדכון לאילן היוחסין - משפחת גלזר*\n\n` +
                            `*עבור:* ${data.node ? data.node.name : currentEditingNodeId}\n` +
                            `*סוג עדכון:* ${data.type}\n` +
                            `*שם מדווח/ת:* ${data.reporter}\n\n` +
                            `*פירוט התיקון / הוספה:*\n${data.details}`;

                const encodedMsg = encodeURIComponent(msg);
                window.open(`https://api.whatsapp.com/send?phone=${adminPhone}&text=${encodedMsg}`, '_blank');
            });

            document.getElementById("sendEmailBtn").addEventListener("click", () => {
                const data = getUpdateData();
                if (!data) return;

                const subject = `הצעת עדכון באילן היוחסין - ${data.node ? data.node.name : ''}`;
                const body = `הצעת עדכון מאת: ${data.reporter}\n` +
                             `עבור: ${data.node ? data.node.name : ''}\n` +
                             `סוג עדכון: ${data.type}\n\n` +
                             `פירוט:\n${data.details}`;
                
                const mailtoLink = `mailto:${adminEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                window.location.href = mailtoLink;

                setTimeout(() => {
                    const existingModal = document.getElementById("emailFallbackModal");
                    if (existingModal) existingModal.remove();

                    const modal = document.createElement("div");
                    modal.id = "emailFallbackModal";
                    modal.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in";
                    modal.innerHTML = `
                        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-slate-100 space-y-4" dir="rtl">
                            <h3 class="text-lg font-bold text-slate-900">✉️ שליחת אימייל למנהל השושלת</h3>
                            <p class="text-xs text-slate-600">אם תוכנת האימייל שלך לא נפתחה אוטומטית, באפשרותך להעתיק את הפרטים ולשלוח לכתובת: <strong class="text-blue-600">${adminEmail}</strong></p>
                            
                            <textarea readonly rows="6" class="w-full p-3 text-xs bg-slate-50 border border-slate-300 rounded-xl font-mono select-all focus:outline-none">${body}</textarea>
                            
                            <div class="flex gap-2 pt-2">
                                <button id="copyEmailTextBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-xs shadow-sm">
                                    📋 העתק טקסט ללוח
                                </button>
                                <button id="closeEmailFallback" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2.5 px-4 rounded-xl transition text-xs">
                                    סגור
                                </button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(modal);

                    document.getElementById("copyEmailTextBtn").addEventListener("click", () => {
                        const textarea = modal.querySelector("textarea");
                        textarea.select();
                        document.execCommand('copy');
                        showNotification("הטקסט הועתק בהצלחה!");
                    });

                    document.getElementById("closeEmailFallback").addEventListener("click", () => {
                        modal.remove();
                    });
                }, 500);
            });
        }

        function openModal(nodeId) {
            const node = findNodeById(rawFamilyData, nodeId);
            if (!node) return;

            const modalContent = document.getElementById("modalContent");
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        ${node.gen > 0 ? `
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md badge-gen-${node.gen}">
                                דור ${node.gen}
                            </span>
                        ` : ''}
                        <h2 class="text-xl font-extrabold text-slate-900">${node.name}</h2>
                    </div>

                    ${node.dates ? `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                            <span class="font-bold text-slate-700">🗓️ תאריכים ושנות חיים:</span> ${node.dates}
                        </div>
                    ` : ''}

                    ${node.location ? `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-sm">
                            <span class="font-bold text-slate-700">📍 מיקומים ומסלול הגירה:</span> ${node.location}
                        </div>
                    ` : ''}

                    ${node.bio ? `
                        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100 text-sm leading-relaxed text-slate-800">
                            <span class="font-bold text-blue-900 block mb-1">📜 ביוגרפיה ואירועים היסטוריים:</span>
                            ${node.bio}
                        </div>
                    ` : ''}

                    ${node.children && node.children.length > 0 ? `
                        <div class="pt-2">
                            <h4 class="font-bold text-sm text-slate-700 mb-2">👨‍👩‍👧‍👦 צאצאים ישירים (${node.children.length}):</h4>
                            <div class="flex flex-wrap gap-1.5">
                                ${node.children.map(c => `<span class="bg-slate-100 text-slate-800 text-xs px-2.5 py-1 rounded-lg border border-slate-200 font-medium">${c.name}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            document.getElementById("detailModal").classList.remove("hidden");
        }

        function setupSearch() {
            const searchInput = document.getElementById("searchInput");
            const clearSearchBtn = document.getElementById("clearSearchBtn");
            const searchResultsSummary = document.getElementById("searchResultsSummary");

            function performSearch() {
                const query = searchInput.value.trim().toLowerCase();
                
                document.querySelectorAll(".search-match").forEach(el => {
                    el.classList.remove("search-match");
                });

                if (!query) {
                    clearSearchBtn.classList.add("hidden");
                    searchResultsSummary.classList.add("hidden");
                    return;
                }

                clearSearchBtn.classList.remove("hidden");

                let matchesCount = 0;
                const matchedNodeIds = [];

                function searchTraverse(node) {
                    const textToSearch = `${node.name} ${node.dates || ''} ${node.location || ''} ${node.bio || ''}`.toLowerCase();
                    if (textToSearch.includes(query)) {
                        matchesCount++;
                        matchedNodeIds.push(node.id);
                    }
                    if (node.children) {
                        node.children.forEach(searchTraverse);
                    }
                }

                searchTraverse(rawFamilyData);

                if (matchesCount > 0) {
                    searchResultsSummary.classList.remove("hidden");
                    searchResultsSummary.textContent = `נמצאו ${matchesCount} תוצאות עבור "${query}". הענפים הנדרשים הורחבו.`;

                    matchedNodeIds.forEach(id => {
                        expandAncestors(rawFamilyData, id);
                    });

                    renderTree();

                    matchedNodeIds.forEach(id => {
                        const card = document.getElementById(`node-${id}`);
                        if (card) {
                            card.classList.add("search-match");
                        }
                    });

                    const firstMatchCard = document.getElementById(`node-${matchedNodeIds[0]}`);
                    if (firstMatchCard) {
                        firstMatchCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    searchResultsSummary.classList.remove("hidden");
                    searchResultsSummary.textContent = `לא נמצאו תוצאות עבור "${query}".`;
                }
            }

            function expandAncestors(node, targetId) {
                if (node.id === targetId) return true;
                if (node.children) {
                    for (let child of node.children) {
                        if (expandAncestors(child, targetId)) {
                            expandedState[node.id] = true;
                            return true;
                        }
                    }
                }
                return false;
            }

            searchInput.addEventListener("input", performSearch);
            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                performSearch();
            });
        }

        function renderTree() {
            const container = document.getElementById("treeContainer");
            container.innerHTML = "";
            container.appendChild(renderNode(rawFamilyData));
        }

        function setAllExpanded(node, state) {
            expandedState[node.id] = state;
            if (node.children) {
                node.children.forEach(child => setAllExpanded(child, state));
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const stats = calculateStats(rawFamilyData);
            document.getElementById("totalPersons").textContent = `${stats.totalPersons} נפשות`;
            document.getElementById("totalDescendants").textContent = `${stats.totalDescendants} צאצאים`;

            const genBreakdownEl = document.getElementById("genBreakdown");
            genBreakdownEl.innerHTML = `
                <span class="px-2 py-0.5 rounded badge-gen-1 font-semibold">דור 1: ${stats.genCounts[1]}</span>
                <span class="px-2 py-0.5 rounded badge-gen-2 font-semibold">דור 2: ${stats.genCounts[2]}</span>
                <span class="px-2 py-0.5 rounded badge-gen-3 font-semibold">דור 3: ${stats.genCounts[3]}</span>
                <span class="px-2 py-0.5 rounded badge-gen-4 font-semibold">דור 4: ${stats.genCounts[4]}</span>
                <span class="px-2 py-0.5 rounded badge-gen-5 font-semibold">דור 5: ${stats.genCounts[5]}</span>
            `;

            initInitialState(rawFamilyData);
            renderTree();
            setupSearch();
            setupUpdateSubmission();

            document.getElementById("expandAllBtn").addEventListener("click", () => {
                setAllExpanded(rawFamilyData, true);
                renderTree();
            });

            document.getElementById("collapseAllBtn").addEventListener("click", () => {
                initInitialState(rawFamilyData);
                renderTree();
            });

            document.getElementById("closeModal").addEventListener("click", () => {
                document.getElementById("detailModal").classList.add("hidden");
            });

            document.getElementById("detailModal").addEventListener("click", (e) => {
                if (e.target.id === "detailModal") {
                    document.getElementById("detailModal").classList.add("hidden");
                }
            });

            document.getElementById("closeEditModal").addEventListener("click", () => {
                document.getElementById("editModal").classList.add("hidden");
            });

            document.getElementById("editModal").addEventListener("click", (e) => {
                if (e.target.id === "editModal") {
                    document.getElementById("editModal").classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
