        let activeFilters = { search: '', gen: 'all' };

        // Helper to count nodes
        function countNodes(node) {
            let count = 1;
            if (node.children) {
                node.children.forEach(c => count += countNodes(c));
            }
            return count;
        }

        // Render Tree Recursively
        function createTreeNodeHTML(node) {
            const hasChildren = node.children && node.children.length > 0;
            const badgeClass = `badge-gen-${node.gen}`;
            const genClass = `gen-${node.gen}`;

            let html = `
                <div class="tree-node-wrapper mb-3" data-id="${node.id}" data-gen="${node.gen}">
                    <div class="card ${genClass} p-3 sm:p-4 rounded-xl shadow-sm hover:shadow-md transition flex flex-col sm:flex-row sm:items-center justify-between gap-2 border border-slate-200 cursor-pointer" onclick="openDetails('${node.id}')">
                        <div class="flex items-center gap-3">
                            ${hasChildren ? `
                                <button onclick="event.stopPropagation(); toggleNode('${node.id}')" class="toggle-btn w-6 h-6 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-xs transition">
                                    <span id="icon-${node.id}">▼</span>
                                </button>
                            ` : '<span class="w-6"></span>'}
                            
                            <div>
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="font-bold text-slate-900 text-base sm:text-lg">${node.name}</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${badgeClass}">דור ${node.gen}</span>
                                </div>
                                ${node.location ? `<p class="text-xs text-slate-500 mt-0.5">📍 ${node.location}</p>` : ''}
                            </div>
                        </div>

                        <div class="flex items-center gap-2 mr-9 sm:mr-0">
                            ${node.children ? `<span class="text-xs text-slate-400 font-medium bg-slate-50 px-2 py-1 rounded-md border">${node.children.length} צאצאים ישירים</span>` : ''}
                            <button onclick="event.stopPropagation(); openDetails('${node.id}')" class="text-xs text-blue-600 hover:text-blue-800 font-semibold px-2 py-1 rounded bg-blue-50 hover:bg-blue-100 transition">פרטים</button>
                        </div>
                    </div>

                    ${hasChildren ? `
                        <div id="children-${node.id}" class="children-container tree-line mr-4 sm:mr-8 pt-2 space-y-2">
                            ${node.children.map(c => createTreeNodeHTML(c)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            return html;
        }

        // Toggle Expand/Collapse
        function toggleNode(id) {
            const container = document.getElementById(`children-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (container) {
                if (container.classList.contains('hidden')) {
                    container.classList.remove('hidden');
                    if (icon) icon.innerText = '▼';
                } else {
                    container.classList.add('hidden');
                    if (icon) icon.innerText = '◀';
                }
            }
        }

        function setAllExpanded(expand) {
            const containers = document.querySelectorAll('.children-container');
            containers.forEach(c => {
                const id = c.id.replace('children-', '');
                const icon = document.getElementById(`icon-${id}`);
                if (expand) {
                    c.classList.remove('hidden');
                    if (icon) icon.innerText = '▼';
                } else {
                    c.classList.add('hidden');
                    if (icon) icon.innerText = '◀';
                }
            });
        }

        // Search and Filter Logic
        function findNode(node, id) {
            if (node.id === id) return node;
            if (node.children) {
                for (let child of node.children) {
                    const res = findNode(child, id);
                    if (res) return res;
                }
            }
            return null;
        }

        function filterTree() {
            const query = activeFilters.search.toLowerCase();
            const selectedGen = activeFilters.gen;

            const nodes = document.querySelectorAll('.tree-node-wrapper');
            let matchCount = 0;

            nodes.forEach(wrapper => {
                const nodeId = wrapper.getAttribute('data-id');
                const node = findNode(familyData, nodeId);
                if (!node) return;

                const nameMatch = node.name.toLowerCase().includes(query);
                const locMatch = node.location ? node.location.toLowerCase().includes(query) : false;
                const bioMatch = node.bio ? node.bio.toLowerCase().includes(query) : false;
                const textMatch = !query || nameMatch || locMatch || bioMatch;

                const genMatch = selectedGen === 'all' || node.gen.toString() === selectedGen;

                if (textMatch && genMatch) {
                    wrapper.style.display = 'block';
                    matchCount++;
                    // Expand parents if searching
                    if (query) {
                        let p = wrapper.parentElement;
                        while (p && !p.classList.contains('max-w-7xl')) {
                            if (p.classList.contains('children-container')) {
                                p.classList.remove('hidden');
                                const pId = p.id.replace('children-', '');
                                const icon = document.getElementById(`icon-${pId}`);
                                if (icon) icon.innerText = '▼';
                            }
                            p = p.parentElement;
                        }
                    }
                } else {
                    wrapper.style.display = 'none';
                }
            });

            const summary = document.getElementById('searchResultsSummary');
            if (query || selectedGen !== 'all') {
                summary.classList.remove('hidden');
                summary.innerText = `נמצאו ${matchCount} תוצאות לפי הסינון הנוכחי`;
            } else {
                summary.classList.add('hidden');
            }
        }

        // Modal Handler
        function openDetails(id) {
            const node = findNode(familyData, id);
            if (!node) return;

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <span class="inline-block px-3 py-1 text-xs font-bold rounded-full badge-gen-${node.gen} mb-2">דור ${node.gen}</span>
                        <h2 class="text-2xl font-bold text-slate-900">${node.name}</h2>
                        ${node.dates ? `<p class="text-sm font-semibold text-slate-600 mt-1">🗓️ שנות חיים/תאריכים: ${node.dates}</p>` : ''}
                    </div>

                    ${node.location ? `
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <span class="text-xs font-bold text-slate-400 block mb-1">מקום מגורים/הגירה:</span>
                            <span class="text-sm text-slate-800 font-medium">📍 ${node.location}</span>
                        </div>
                    ` : ''}

                    ${node.bio ? `
                        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-100">
                            <span class="text-xs font-bold text-blue-600 block mb-1">מידע היסטורי וביוגרפי:</span>
                            <p class="text-sm text-slate-700 leading-relaxed">${node.bio}</p>
                        </div>
                    ` : ''}

                    ${node.children ? `
                        <div class="border-t pt-3">
                            <span class="text-xs font-bold text-slate-400 block mb-2">צאצאים ישירים (${node.children.length}):</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${node.children.map(c => `<span class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md font-medium border cursor-pointer" onclick="openDetails('${c.id}')">${c.name}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            const treeContainer = document.getElementById('treeContainer');
            treeContainer.innerHTML = createTreeNodeHTML(familyData);

            // Controls
            document.getElementById('searchInput').addEventListener('input', (e) => {
                activeFilters.search = e.target.value;
                filterTree();
            });

            document.getElementById('genFilter').addEventListener('change', (e) => {
                activeFilters.gen = e.target.value;
                filterTree();
            });

            document.getElementById('expandAllBtn').addEventListener('click', () => setAllExpanded(true));
            document.getElementById('collapseAllBtn').addEventListener('click', () => setAllExpanded(false));

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('detailModal').classList.add('hidden');
            });

            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    document.getElementById('detailModal').classList.add('hidden');
                }
            });
        });
    </script>
